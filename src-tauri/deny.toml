[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu"]

[advisories]
ignore = [{ id = "RUSTSEC-2024-0436", reason = "Reviewed: unmaintained compile-time paste macro through Lofty 0.25.4; no patched upgrade exists. No runtime vulnerability is alleged. Track replacement in the next dependency review." }]

[licenses]
confidence-threshold = 0.8
allow = ["GPL-3.0-or-later", "MIT", "MIT-0", "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "CC0-1.0", "Unlicense", "OpenSSL", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
