[package]
name = "tagforge"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Local-first music metadata editor"

[lib]
name = "tagforge_lib"
crate-type = ["lib"]

[[bin]]
name = "TagForge"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:rfd", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
lofty = "=0.25.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2", features = [], optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
codegen-units = 16
opt-level = 2
lto = false
strip = true
