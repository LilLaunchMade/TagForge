name: Windows verification and installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --only-shell
      - run: npm run test:ui
      - name: Development-only FFmpeg fixtures
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false @ffmpeg-installer/win32-x64@4.1.0
          "FFMPEG_PATH=$PWD\node_modules\@ffmpeg-installer\win32-x64\ffmpeg.exe" >> $env:GITHUB_ENV
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features -- --test-threads=1
      - run: cargo install cargo-deny --locked
      - run: cargo deny --manifest-path src-tauri/Cargo.toml --config src-tauri/deny.toml check licenses advisories
      - run: npm run licenses
      - run: ./scripts/rust-notices.ps1
      - run: ./scripts/package.ps1
      - run: python scripts/inspect-pe.py src-tauri/target/release/TagForge.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TagForge-v1.0.0-Windows-review
          path: |
            release/TagForge-v1.0.0-Setup.exe
            release/SHA256.txt
            docs/licenses/
